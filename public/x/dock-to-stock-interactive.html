<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#21201e">
<title>Dock-to-Stock · คลังสินค้าแบบใหม่</title>
<!--
  วิธีใช้: ไฟล์เดียวจบ เปิดได้เลย หรือฝังในเว็บด้วย
  <iframe src="dock-to-stock-interactive.html" style="width:100%;aspect-ratio:1180/820;border:0" allow="fullscreen"></iframe>
  ฟอนต์: อังกฤษใช้ Pretendard ไทยใช้ Kanit (ตั้งที่ --font ใน CSS)
  ปรับชื่อแบรนด์ ลิงก์โลโก้ และความเร็วโหมดอัตโนมัติได้ที่ CONFIG ในสคริปต์ด้านล่าง
  ข้อมูลทั้งหมดในไฟล์นี้เป็นตัวอย่างสมมติ ไม่ใช่ข้อมูลจริงของบุญถาวร
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --black:#21201e; --dg:#56595a; --lg:#dce0e1; --white:#ffffff;
  --red:#ed0100; --orange:#f06421; --pink:#ea0772; --blue:#173c88; --green:#009745;
  --blue-t:#7aa0f0; --green-t:#35c27a; --red-t:#ff6b64;
  --font:'Pretendard','Kanit','Noto Sans Thai','Sarabun',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --u:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--black);color:var(--white);font-family:var(--font);overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue-t);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- แถบบน ---------- */
#top{flex:0 0 58px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid rgba(220,224,225,.12);background:var(--black);z-index:6}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;white-space:nowrap}
.brand b{color:var(--red);letter-spacing:.03em;font-weight:700}
.brand i{width:2px;height:22px;background:var(--dg)}
.brand span{color:var(--red)}
.brand img{height:30px;width:auto}
#prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#segs{display:flex;gap:4px}
#segs i{flex:1;height:5px;border-radius:3px;background:rgba(220,224,225,.16);transition:background .3s}
#segs i.done{background:var(--lg)}
#segs i.cur{background:var(--red)}
#stepName{font-size:14px;color:var(--lg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(220,224,225,.1);font-size:13px;font-weight:500;white-space:nowrap}
.chip.ok{background:rgba(0,151,69,.22);color:var(--green-t)}
.chip.warn{background:rgba(237,1,0,.22);color:#ff6b64}
.chip.bad{background:rgba(237,1,0,.22);color:var(--red-t)}
.tb{height:44px;min-width:44px;padding:0 14px;border-radius:22px;border:1px solid rgba(220,224,225,.22);background:transparent;font-size:14px;font-weight:600}
.tb.on{background:var(--red);border-color:var(--red);color:#fff}
.tb.tg[aria-pressed="false"]{opacity:.55}
@media (max-width:1320px){#chipScan,#chipVendor{display:none}}

/* ---------- ฉาก 3D ---------- */
#main{flex:1;position:relative;min-height:0}
#scene{position:absolute;inset:0;overflow:hidden;background:var(--black)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.5) 100%)}
#noGL{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;padding:40px;font-size:18px;color:var(--lg)}
#noGL[hidden]{display:none}
#dash{position:absolute;left:0;top:0;bottom:0;right:var(--pw,0px);z-index:5;overflow:auto;padding:18px 18px 28px;background:rgba(33,32,30,.97);-webkit-overflow-scrolling:touch}
#dash[hidden]{display:none}
#dash .dh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#dash .dh h2{font-size:24px;font-weight:600;line-height:1.2}
#dash .dh p{font-size:13px;color:var(--lg);opacity:.8}
#dash .dx{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(220,224,225,.28);background:transparent;font-size:16px}
#dash .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#dash .dc{background:rgba(220,224,225,.06);border:1px solid rgba(220,224,225,.14);border-radius:18px;padding:14px 16px;min-width:0}
#dash .s2{grid-column:span 2}#dash .s4{grid-column:span 4}
#dash .dc h3{font-size:14px;font-weight:600;color:var(--lg);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#dash .big{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
#dash .big.ok{color:var(--green-t)}#dash .big.bad{color:var(--red-t)}
#dash .sub{font-size:12px;color:var(--lg);opacity:.8;margin-top:4px;line-height:1.4}
#dash .tg{font-size:11px;font-weight:500;padding:1px 8px;border-radius:99px;background:rgba(220,224,225,.16);color:var(--lg)}
#dash .tg.live{background:rgba(0,151,69,.28);color:var(--green-t)}
#dash .br{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
#dash .br span:first-child{width:96px;flex:none;color:var(--lg)}
#dash .br span:last-child{width:46px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
#dash .bar{flex:1;height:10px;border-radius:6px;background:rgba(220,224,225,.14);overflow:hidden}
#dash .bar i{display:block;height:100%;background:var(--green-t)}#dash .bar i.r{background:var(--red)}
#dash .vr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(220,224,225,.1);font-size:13px}
#dash .vr b{width:70px;flex:none}
#dash .dots{display:flex;gap:3px;margin-left:auto}#dash .dots i{width:9px;height:9px;border-radius:50%;background:var(--green-t)}#dash .dots i.f{background:var(--red)}
#dash table{width:100%;border-collapse:collapse;font-size:12.5px}
#dash th{font-weight:500;color:var(--lg);opacity:.75;text-align:left;padding:4px 5px;border-bottom:1px solid rgba(220,224,225,.18)}
#dash td{padding:5px;border-bottom:1px solid rgba(220,224,225,.08)}
#dash .chips{display:flex;flex-wrap:wrap;gap:8px}#dash .chips span{font-size:12.5px;padding:5px 12px;border-radius:99px;border:1px solid rgba(220,224,225,.22)}
#dash .res{font-weight:600}#dash .res.p{color:var(--green-t)}#dash .res.n{color:var(--red-t)}
#pins{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s;will-change:transform}
.pin.on{opacity:1}
.pin::after{content:"";position:absolute;left:-1px;bottom:0;width:2px;height:46px;background:linear-gradient(var(--blue-t),rgba(122,160,240,0))}
.pin .box{position:absolute;left:-15px;bottom:46px;display:flex;gap:10px;align-items:center;white-space:nowrap;padding:6px 14px 6px 6px;border-radius:99px;background:rgba(33,32,30,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(220,224,225,.16)}
.pin.flip .box{left:auto;right:-15px;flex-direction:row-reverse;padding:6px 6px 6px 14px;text-align:right}
.pin .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--blue-t);color:var(--black);flex:none}
.pin.pink .ic{background:var(--pink);color:#fff}.pin.pink::after{background:linear-gradient(var(--pink),rgba(234,7,114,0))}
.pin.red .ic{background:var(--red);color:#fff}.pin.red::after{background:linear-gradient(var(--red),rgba(237,1,0,0))}
.pin.green .ic{background:var(--green-t);color:var(--black)}.pin.green::after{background:linear-gradient(var(--green-t),rgba(53,194,122,0))}
.pin.gray .ic{background:var(--lg);color:var(--black)}.pin.gray::after{background:linear-gradient(var(--lg),rgba(220,224,225,0))}
.pin .k{font-size:12px;color:var(--lg);opacity:.85;line-height:1.2}
.pin .t{font-size:15px;font-weight:600;line-height:1.25}
.pin.big .box{border-color:var(--red);background:rgba(33,32,30,.92)}

#hud{position:absolute;right:calc(var(--pw,0px) + 16px);bottom:16px;z-index:3;display:flex;align-items:center;gap:14px;padding:12px 18px 12px 14px;border-radius:20px;background:rgba(33,32,30,.76);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(220,224,225,.16)}
#hud svg{display:block}
#hud .pct{position:absolute;left:0;top:0;width:84px;height:84px;display:grid;place-items:center;font-size:17px;font-weight:600}
#hud .ring{position:relative;width:84px;height:84px}
#hud .n{font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
#hud .l{font-size:13px;color:var(--lg);line-height:1.35;max-width:210px}
#hud .l2{font-size:12px;color:var(--lg);opacity:.8;line-height:1.35;max-width:210px;margin-top:2px}
#hud .tag{font-size:11px;color:var(--dg);background:var(--lg);border-radius:99px;padding:1px 8px;margin-top:4px;display:inline-block}

#drawerBtn{position:absolute;left:16px;bottom:16px;z-index:4;height:46px;padding:0 20px;border-radius:23px;background:rgba(33,32,30,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(220,224,225,.28);font-size:15px;font-weight:600}
#drawerBtn[aria-expanded="true"]{background:var(--lg);color:var(--black)}
#drawerBtn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:8px;vertical-align:middle}
#drawer{position:absolute;left:16px;bottom:72px;z-index:4;width:min(420px,calc(100% - var(--pw,0px) - 32px));max-height:min(62%,520px);overflow:auto;padding:16px 18px 18px;border-radius:20px;background:rgba(33,32,30,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(220,224,225,.18);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s;-webkit-overflow-scrolling:touch}
#drawer.open{opacity:1;transform:none;pointer-events:auto}
#drawer .dtabs{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:-16px;padding:2px 0 8px;background:rgba(33,32,30,.96);z-index:1}
#drawer .dtabs button{flex:1;min-height:40px;border-radius:99px;border:1px solid rgba(220,224,225,.25);background:transparent;font:600 13px var(--font);color:var(--white)}
#drawer .dtabs button.on{background:var(--lg);color:var(--black)}
#drawer ol{padding-left:20px;margin:6px 0}
#drawer h4{font-size:17px;font-weight:600;margin-bottom:8px}
#drawer p,#drawer li{font-size:14px;line-height:1.55;color:var(--lg)}
#drawer ul{padding-left:18px;margin:6px 0}
#drawer .f{margin:8px 0;padding:10px 12px;border-radius:12px;background:rgba(220,224,225,.08);font-size:14px;line-height:1.6;color:var(--white)}
#drawer .f small{display:block;color:var(--lg);opacity:.8;font-size:12px}
#drawer table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
#drawer th{font-weight:500;color:var(--lg);opacity:.75;text-align:left;padding:4px 6px;border-bottom:1px solid rgba(220,224,225,.18)}
#drawer td{padding:4px 6px;border-bottom:1px solid rgba(220,224,225,.08);font-variant-numeric:tabular-nums}
#drawer tr.me td{background:rgba(237,1,0,.2);font-weight:600}
#drawer .a{color:#ff6b64;font-weight:700}#drawer .b{color:var(--blue-t);font-weight:700}#drawer .c{color:var(--lg);font-weight:700}
#drawer canvas{width:100%;height:150px;display:block;margin-top:6px}
#drawer .warn{color:#ff6b64}
#info{position:absolute;left:16px;top:16px;z-index:4;width:min(360px,calc(100% - var(--pw,0px) - 32px));max-height:calc(100% - 110px);overflow:auto;padding:14px 16px 16px;border-radius:20px;background:rgba(33,32,30,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(237,1,0,.55);-webkit-overflow-scrolling:touch}
#info[hidden]{display:none}
#info .ih{display:flex;gap:12px;align-items:center}
#info .ik{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
#info .it{font-size:18px;font-weight:600;line-height:1.25}
#info .is{font-size:12px;color:var(--lg);opacity:.8}
#info .ix{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(220,224,225,.25);background:transparent;font-size:16px;flex:none}
#info .ir{margin-top:12px}
#info .ir b{display:block;font-size:12px;color:var(--red-t);font-weight:600;margin-bottom:2px}
#info .ir p{font-size:14px;line-height:1.55;color:var(--white)}
#info .ir.now{padding:8px 10px;border-radius:12px;background:rgba(220,224,225,.08)}
#hud{cursor:pointer}
#hud.gone{display:none}
#hudMin{position:absolute;right:8px;bottom:6px;height:26px;padding:0 10px;border-radius:13px;background:rgba(220,224,225,.14);color:var(--lg);font-size:11px;font-weight:600;border:1px solid rgba(220,224,225,.22)}
#hudCap{position:absolute;right:calc(var(--pw,0px) + 16px);bottom:16px;z-index:4;height:46px;padding:0 18px;border-radius:23px;background:rgba(33,32,30,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(220,224,225,.28);font-size:15px;font-weight:600;display:none;align-items:center;gap:8px}
#hudCap.on{display:inline-flex}
#hudCap .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
#toast{position:absolute;left:calc((100% - var(--pw,0px))/2);top:16px;transform:translate(-50%,-10px);z-index:5;padding:10px 18px;border-radius:99px;background:var(--lg);color:var(--black);font-size:15px;font-weight:600;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- แผง handheld ---------- */
#panel{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:flex-end;padding:12px 14px 12px 12px;z-index:6;pointer-events:none}
#phone{position:relative;pointer-events:auto;background:#0e0d0c;box-shadow:0 0 0 2px #3a3b3c,0 22px 60px rgba(0,0,0,.6);flex:none}
#phone .scr{position:absolute;overflow:hidden;background:#fff}
.trig{position:absolute;top:34%;width:calc(var(--u)*12px);height:calc(var(--u)*92px);border:0;border-radius:6px;background:linear-gradient(90deg,#56595a,#7a7d7e);box-shadow:0 0 0 1px #000;z-index:3}
.trig::before{content:"";position:absolute;inset:-14px -16px}
.trig:active{filter:brightness(1.4)}
#trigL{left:calc(var(--u)*-8px)}#trigR{right:calc(var(--u)*-8px);transform:scaleX(-1)}
.trig span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);font-size:calc(var(--u)*9px);font-weight:700;color:#fff;letter-spacing:.08em}
#trigR span{transform:translate(-50%,-50%) rotate(90deg) scaleX(-1)}

.hh{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;color:var(--black);font-size:calc(var(--u)*16px);line-height:1.35}
.hh-status{flex:none;height:2.6em;background:var(--black);color:var(--lg);display:flex;justify-content:space-between;align-items:center;padding:.55em 2.1em 0;font-size:.74em;font-weight:500}
.hh-head{flex:none;background:var(--black);color:#fff;padding:.35em .95em .75em;border-bottom:.28em solid var(--red)}
.hh-head .t{font-size:1.25em;font-weight:700;line-height:1.25}
.hh-head .s{font-size:.8em;color:var(--lg);margin-top:.1em}
.hh-body{flex:1;overflow:auto;padding:.85em .95em;display:flex;flex-direction:column;gap:.75em;-webkit-overflow-scrolling:touch}
.hh-body.in{animation:slide .3s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.hh-foot{flex:none;padding:.7em .95em .85em;border-top:1px solid var(--lg);display:flex;flex-direction:column;gap:.5em;background:#fff}
.btn{appearance:none;border:0;border-radius:.85em;font:700 1.12em var(--font);min-height:2.95em;padding:0 1em;display:flex;align-items:center;justify-content:center;gap:.5em;width:100%;background:var(--black);color:#fff;text-align:center}
.btn.primary{background:var(--red)}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
.btn.ghost{background:#fff;color:var(--black);border:2px solid var(--lg)}
.btn.small{min-height:2.4em;font-size:.95em}
.btn:disabled{background:var(--lg);color:#8b8e8f;cursor:not-allowed;border-color:var(--lg)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.pulse:not(:disabled){animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(237,1,0,.45)}70%{box-shadow:0 0 0 .8em rgba(237,1,0,0)}100%{box-shadow:0 0 0 0 rgba(237,1,0,0)}}
.link{background:none;border:0;color:var(--blue);font:600 .9em var(--font);text-decoration:underline;padding:.5em;min-height:2.4em;text-align:center}
.lbl{font-size:.82em;font-weight:600;color:var(--dg);margin-bottom:.25em}
.seg{display:flex;gap:.4em}
.seg button{flex:1;min-height:2.9em;border-radius:.75em;border:2px solid var(--lg);background:#fff;color:var(--black);font:600 .92em var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seg button small{font-size:.75em;font-weight:400;color:var(--dg)}
.seg button.on{background:var(--black);border-color:var(--black);color:#fff}
.seg button.on small{color:var(--lg)}
select,input[type=number]{width:100%;min-height:2.9em;border-radius:.75em;border:2px solid var(--lg);padding:0 .8em;font:600 1em var(--font);background:#fff;color:var(--black)}
.row2{display:flex;gap:.5em;align-items:center}
.stp{display:flex;align-items:center;gap:.4em}
.stp button{width:2.7em;height:2.7em;border-radius:.7em;border:2px solid var(--lg);background:#fff;font:700 1.25em var(--font);color:var(--black);display:grid;place-items:center;flex:none}
.stp output{min-width:2.4em;text-align:center;font-size:1.35em;font-weight:700;font-variant-numeric:tabular-nums}
.stp.sm button{width:2.3em;height:2.3em;font-size:1.1em}
.card{border:2px solid var(--lg);border-radius:.9em;padding:.7em .8em;display:flex;flex-direction:column;gap:.2em;background:#fff;text-align:left;width:100%;font-size:1em;color:var(--black)}
.card.sel{border-color:var(--green);background:#eefaf3}
.card.dim{opacity:.55}
.card b{font-size:1.05em}.card small{color:var(--dg);font-size:.82em}
.hchip{display:inline-flex;align-items:center;gap:.3em;padding:.12em .6em;border-radius:99px;font-size:.78em;font-weight:600;background:var(--lg);color:var(--black);align-self:flex-start}
.hchip.ok{background:#d6f2e1;color:#006b31}.hchip.warn{background:#ffe1e0;color:#b30000}.hchip.bad{background:#ffd9d9;color:#a80000}.hchip.info{background:#dce5f8;color:#173c88}
.note{font-size:.84em;color:var(--dg);line-height:1.45}
.note.warn{color:#b30000;font-weight:600}
.big{border-radius:1em;padding:1em;display:flex;flex-direction:column;gap:.3em;align-items:center;text-align:center;border:2px solid var(--lg)}
.big .v{font-size:2em;font-weight:700;line-height:1.1}
.big.ok{background:#e8f8ef;border-color:var(--green);color:#005a29}
.big.bad{background:#fff0f0;border-color:var(--red);color:#9b0000}
.big.info{background:#eaf0fc;border-color:var(--blue);color:#173c88}

<script>
(function(){
'use strict';

/* =====================================================================
   CONFIG  ปรับตรงนี้
   ===================================================================== */
const CONFIG = {
  brand: 'SUVICHA',
  logoSrc: '',            // ใส่ URL รูปโลโก้ ถ้าต้องการแทนข้อความ
  autoDelay: 1500         // มิลลิวินาทีต่อการกดหนึ่งครั้งในโหมดอัตโนมัติ
};

/* =====================================================================
   สี (พาเลตต์บุญถาวร + เฉดอ่อนสำหรับตัวหนังสือบนพื้นดำ)
   ===================================================================== */
const C = {black:0x21201e,dg:0x56595a,lg:0xdce0e1,white:0xffffff,red:0xed0100,orange:0xf06421,pink:0xea0772,
           blue:0x173c88,green:0x009745,blueT:0x6f95e8,blueM:0x2b56b8,greenT:0x35c27a};

const $ = (s,r)=> (r||document).querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmt=n=>Number(n).toLocaleString('en-US');
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const easeOut=k=>1-Math.pow(1-k,3);
const lerp=(a,b,k)=>a+(b-a)*k;
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* =====================================================================
   ข้อมูลตัวอย่าง
   ===================================================================== */
const SKUS = [
  {id:'T01',name:'กระเบื้องพื้น 60×60 ขาว',picks:420,heavy:true,fragile:false},
  {id:'T02',name:'กระเบื้องผนัง 30×60 ครีม',picks:300,heavy:true,fragile:false},
  {id:'S01',name:'ชักโครก รุ่น A',picks:180,heavy:true,fragile:true},
  {id:'T03',name:'กระเบื้องพื้น 60×60 เทา',picks:150,heavy:true,fragile:false},
  {id:'F01',name:'ก๊อกน้ำ รุ่น B',picks:120,heavy:false,fragile:false},
  {id:'T04',name:'กระเบื้องลายไม้ 20×120',picks:60,heavy:true,fragile:false},
  {id:'S02',name:'อ่างล้างหน้า รุ่น C',picks:50,heavy:true,fragile:true},
  {id:'F02',name:'ฝักบัว รุ่น D',picks:40,heavy:false,fragile:false},
  {id:'T05',name:'กระเบื้องโมเสก',picks:25,heavy:false,fragile:false},
  {id:'K01',name:'ซิงค์ล้างจาน',picks:20,heavy:false,fragile:false},
  {id:'N01',name:'ฝักบัวฝน รุ่น E (สินค้าใหม่)',picks:null,heavy:false,fragile:false}
];
const skuById = id => SKUS.find(s=>s.id===id);
(function abc(){
  const rows=SKUS.filter(s=>s.picks!=null).slice().sort((a,b)=>b.picks-a.picks);
  const total=rows.reduce((a,s)=>a+s.picks,0); let cum=0;
  rows.forEach(s=>{cum+=s.picks;s.pct=s.picks/total*100;s.cum=cum/total*100;s.grp=s.cum<=80?'A':s.cum<=95?'B':'C';});
  SKUS.filter(s=>s.picks==null).forEach(s=>{s.pct=null;s.cum=null;s.grp='B';});
  SKUS.forEach(s=>{
    const COVER={T01:1.6,T02:1.4,S01:2,T03:1.8,F01:1.5,T04:4.2,S02:5.5,F02:3.2,T05:8,K01:9};
    s.onhand=s.picks==null?200:Math.round(s.picks*COVER[s.id]/10)*10;
    s.max=Math.ceil(s.onhand*2.2/100)*100;
  });
  SKUS.abcRows=rows; SKUS.total=total;
})();

const VENDORS = {
  A:{name:'โรงงาน A',note:'เซรามิก',dock:1,state:'reduced',hist:'PPPPPPPPPP'.split('')},
  B:{name:'โรงงาน B',note:'สุขภัณฑ์',dock:2,state:'normal',hist:['P','P','F','P','P']},
  C:{name:'โรงงาน C',note:'ก๊อก/อุปกรณ์',dock:3,state:'tightened',hist:['P','F','P','F','P']}
};
const LEVEL_NAME={normal:'ปกติ',tightened:'เข้มงวด',reduced:'ผ่อนผัน'};
const VENDORS0 = JSON.parse(JSON.stringify(VENDORS));
function pushVendor(v,ok){
  v.hist.push(ok?'P':'F');
  const l5=v.hist.slice(-5), l10=v.hist.slice(-10);
  if(v.state==='normal'){
    if(l5.filter(x=>x==='F').length>=2) v.state='tightened';
    else if(l10.length>=10&&l10.every(x=>x==='P')) v.state='reduced';
  }else if(v.state==='tightened'){
    if(l5.length>=5&&l5.every(x=>x==='P')) v.state='normal';
  }else if(v.state==='reduced'){
    if(!ok) v.state='normal';
  }
}
function consecPass(v){let n=0;for(let i=v.hist.length-1;i>=0&&v.hist[i]==='P';i--)n++;return n;}

/* แผนสุ่มตรวจ: MIL-STD-105E / ANSI Z1.4 / ISO 2859-1 ระดับทั่วไป II ตรวจแบบปกติ
   (สำคัญ AQL 1.0 · เล็กน้อย AQL 4.0) อ่านจาก Table II-A ในหนังสือ Montgomery */
const PLAN=[
  {max:90,   nMaj:13, acMaj:0, nMin:13, acMin:1},
  {max:150,  nMaj:13, acMaj:0, nMin:20, acMin:2},
  {max:280,  nMaj:50, acMaj:1, nMin:32, acMin:3},
  {max:500,  nMaj:50, acMaj:1, nMin:50, acMin:5},
  {max:1200, nMaj:80, acMaj:2, nMin:80, acMin:7},
  {max:3200, nMaj:125,acMaj:3, nMin:125,acMin:10}
];
const PLAN_LABEL=['≤ 90','91–150','151–280','281–500','501–1,200','1,201–3,200'];
function planFor(N){
  const idx=Math.max(0,PLAN.findIndex(r=>N<=r.max)); const row=PLAN[idx<0?PLAN.length-1:idx];
  const nMaj=Math.min(row.nMaj,N), nMin=Math.min(row.nMin,N);
  const n=Math.max(nMaj,nMin);
  return {idx:PLAN.indexOf(row),nMaj,nMin,n,acMaj:row.acMaj,reMaj:row.acMaj+1,acMin:row.acMin,reMin:row.acMin+1,full:n>=N};
}
function decide(pl,d){
  const r=[];
  if(d.crit>=1) r.push('crit');
  if(d.major>=pl.reMaj) r.push('major');
  if(d.minor>=pl.reMin) r.push('minor');
  return {accept:r.length===0,reasons:r};
}
function comb(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r;}
function binomPa(n,c,p){
  if(n<=0) return 1; let s=0;
  for(let d=0;d<=Math.min(c,n);d++) s+=comb(n,d)*Math.pow(p,d)*Math.pow(1-p,n-d);
  return clamp(s,0,1);
}
const lvl=(d,ac)=> d>ac?'bad':(d===ac?'edge':'ok');

/* =====================================================================
   ผังคลัง (หน่วย = เมตร)  แกน x ไปทางตะวันออก, z ไปทางใต้ (ด้านหน้าคลัง)
   ===================================================================== */
const AISLE_X=[-7.5,-2.5,2.5,7.5,12.5,17.5], SLOTS=12, LEVELS=3, SLOT_D=2.4, LEVEL_H=1.6, Z0=14;
const slotZ=k=>Z0-(k-0.5)*SLOT_D;
const zoneOfSlot=k=>k<=4?'A':k<=8?'B':'C';
const DOCK_X=[-28,-23.5,-19,-14.5], DOCK_Z=18;
const DISP={x:26,z:16}, CROSS_Z=16, STAGE_C={x:-22,z:8};
const ZONE_Z={A:9.2,B:-0.4,C:-10};
const ZONE_COL={A:C.red,B:C.blueM,C:C.dg};
const ZONE_NOTE={A:'หยิบบ่อย ใกล้ส่งออก',B:'หยิบปานกลาง',C:'หยิบน้อย ด้านใน'};

const cells=[];
(function(){
  let seed=7; const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  for(let a=0;a<6;a++)for(let k=1;k<=SLOTS;k++)for(let l=1;l<=LEVELS;l++){
    const zone=zoneOfSlot(k);
    cells.push({i:cells.length,a,k,l,zone,x:AISLE_X[a],z:slotZ(k),y:(l-0.5)*LEVEL_H,
      code:zone+'-'+String(a+1).padStart(2,'0')+'-'+String(k).padStart(2,'0')+'-L'+l,
      occ:rnd()<[0,.5,.56,.62][l],pick:0,put:0});

const STAGE_PER=[[-31,2],[-13,2],[-13,14],[-31,14]], STAGE_SEG=[18,12,18,12], STAGE_LEN=60;
function stagePoint(d){
  d=((d%STAGE_LEN)+STAGE_LEN)%STAGE_LEN;
  for(let i=0;i<4;i++){const a=STAGE_PER[i],b=STAGE_PER[(i+1)%4]; if(d<=STAGE_SEG[i]){const k=d/STAGE_SEG[i]; return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];} d-=STAGE_SEG[i];}
  return STAGE_PER[0];
}
function setScan(on){
  if(!W.runner) return; W.runner.visible=on; W.stageGlow.visible=on;
  const m=W.stageLine.material; m.color.setHex(on?C.white:C.lg); m.opacity=on?1:.55;
}
function updateScan(t){
  if(!W.runner||!W.runner.visible) return;
  const at=W.runner.geometry.attributes.position, ac=W.runner.geometry.attributes.color, N=32;
  for(let r=0;r<2;r++) for(let i=0;i<16;i++){
    const q=stagePoint(t*22+r*30-i*.9), k=r*16+i, c=Math.pow(1-i/16,1.6);
    at.array[k*3]=q[0]; at.array[k*3+1]=.14; at.array[k*3+2]=q[1];
    ac.array[k*3]=c; ac.array[k*3+1]=c; ac.array[k*3+2]=c;
  }
  at.needsUpdate=true; ac.needsUpdate=true; W.stageGlow.material.opacity=.3+.25*Math.sin(t*6);
}
function showStoreHighlights(){

    if(c){g.position.set(c.x,c.y,c.z); W.bc[i].position.set(c.x,c.l*LEVEL_H,c.z);}

}
function routePoints(p,c){
  const gx=c.x+2.5;
  return [[p.x,0,p.z-1.9],[p.x,0,CROSS_Z],[gx,0,CROSS_Z],[gx,0,c.z],[c.x+1.9,0,c.z]];
}
let drive=null;
function startDrive(){
  const i=S.trip, p=W.pallets[i], c=S.store[i]; if(!p||!c) return;
  S.arrived=false; S.slotDone=false; S.wrongMsg='';
  scene.attach(p);
  const pts=routePoints(p.position,c).map(a=>new THREE.Vector3(a[0],.12,a[2]));
  const path=new THREE.CurvePath(); for(let j=0;j<pts.length-1;j++) path.add(new THREE.LineCurve3(pts[j],pts[j+1]));
  const len=path.getLength();
  if(W.route){scene.remove(W.route);W.route.geometry.dispose();}
  W.route=new THREE.Mesh(new THREE.TubeGeometry(path,Math.max(40,Math.round(len*2)),.2,6,false),new THREE.MeshBasicMaterial({color:C.red,transparent:true,opacity:.85,depthWrite:false}));
  W.route.userData={info:'route'}; scene.add(W.route);
  setPalletColor(p,C.pink,.6);
  const f=W.fork; f.visible=true; follow=f; goal.r=S.topView?52:40; let rot=0; f.rotation.y=0; f.position.copy(pts[0]);
  const floorY=(c.l-1)*LEVEL_H+.1, speed=S.fastTrips?42:15, dur=Math.max(1.8,len/speed);
  setHighlightColor(i,C.pink);
  drive=tween(dur,k=>{
    const u=ease(k), pt=path.getPointAt(clamp(u,0,1)), tg=path.getTangentAt(clamp(u,.001,.999));
    const target=Math.atan2(tg.x,tg.z); let d=target-rot; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; rot+=d*.22;
    f.position.copy(pt); f.rotation.y=rot;
    const lift=ease(clamp((u-.55)/.4,0,1));
    p.position.set(pt.x+Math.sin(rot)*1.9,lerp(.1,floorY,lift),pt.z+Math.cos(rot)*1.9); p.rotation.y=rot;
  },()=>{
    p.position.set(c.x,floorY,c.z); p.rotation.y=0; S.arrived=true; renderAll();
  });
}
function finishPlace(){
  const i=S.trip,p=W.pallets[i]; setPalletColor(p,C.green,.7); setHighlightColor(i,C.green);
  W.fork.visible=false; follow=null; if(W.route){scene.remove(W.route);W.route.geometry.dispose();W.route=null;}
  setView(7,{tx:S.store[i].x,tz:S.store[i].z,r:46});
}

const visibleChain=o=>{while(o){if(o.visible===false)return false;o=o.parent;}return true;};
const infoOf=o=>{while(o){if(o.userData&&o.userData.info)return o;o=o.parent;}return null;};
function pickNDC(x,y){
  ndc.set(x,y); ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(infoRoots(),true);
  for(let i=0;i<hits.length;i++){
    const h=hits[i]; if(!visibleChain(h.object)) continue;
    if(h.instanceId!=null&&(h.object===W.cellMesh||h.object===W.occ)) return {key:'cell',cell:cells[h.instanceId],obj:null};
    const r=infoOf(h.object); if(r) return {key:r.userData.info,obj:r,idx:r.userData.idx,zone:r.userData.zone};
  }
  return null;
}
function pickAt(cx,cy){

function setupValid(){return S.po>=5&&S.po<=3000&&S.pallets>=1&&S.pallets<=Math.min(10,S.po);}
function palletBoxes(po,P,preset){
  const base=Math.floor(po/P),rem=po%P,a=[]; for(let i=0;i<P;i++)a.push(base+(i<rem?1:0));
  if(preset==='short'){const cut=Math.min(a[P-1],Math.max(1,Math.round(po*.017))); if(po-cut>=1)a[P-1]-=cut;}
  return a;
}
function recount(){
  let s=0; for(let i=0;i<S.scanned;i++)s+=S.palletBoxes[i]; S.counted=Math.max(0,s+S.adj);
}
function initLot(){
  S.dockIdx=VENDORS[S.vendor].dock-1; S.bpp=Math.ceil(S.po/S.pallets);
  S.palletBoxes=palletBoxes(S.po,S.pallets,S.preset);
  S.scanned=0;S.adj=0;S.counted=0;S.listSel=false;S.truckArrived=false;S.dockScanned=false;S.unloaded=false;
  S.plan=null;S.sample={crit:0,major:0,minor:0,checked:false};S.decision=null;S.action=null;S.good=0;S.removed=0;S.accepted=0;S.returned=false;
  S.store=[];S.T=0;S.trip=0;S.sub='a';S.labelDone=false;S.printed=false;S.arrived=false;S.slotDone=false;S.wrongMsg='';
  const sk=skuById(S.sku); S.stockBefore=sk.onhand; S.stockAfter=sk.onhand; S.stats=null;
  clearLot(); buildLotObjects();
}
function initSample(){
  const pl=S.plan=planFor(Math.max(1,S.counted)); const d={crit:0,major:0,minor:Math.min(1,pl.acMin),checked:false};
  if(S.preset==='bad'){d.major=pl.reMaj;d.minor=Math.min(pl.acMin,1);}
  S.sample=d;
}
function computeResult(){
  S.decision=decide(S.plan,S.sample);
  const rem=Math.min(S.counted,S.sample.crit+S.sample.major+S.sample.minor); S.removed=rem; S.action=null;
  if(S.decision.accept){S.accepted=Math.max(0,S.counted-rem);}
  else{S.good=Math.max(0,S.counted-Math.round(rem/Math.max(1,S.plan.n)*S.counted)); S.accepted=0;}
}
function finalizeResult(){
  const v=VENDORS[S.vendor];
  if(S.decision.accept){S.accepted=Math.max(0,S.counted-S.removed); pushVendor(v,true);}
  else{pushVendor(v,false); S.accepted=S.action==='sort'?S.good:0;}
  S.returned=S.accepted<=0;
  const d=new Date(); S.log.unshift({t:d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'),v:v.name,sku:skuById(S.sku).name,qty:S.counted,res:S.decision.accept?'ผ่าน':(S.action==='sort'?'คัดแยก':'คืน'),acc:S.accepted});
  if(S.log.length>8) S.log.length=8;
}
function planStore(){
  const sk=skuById(S.sku); S.T=Math.min(S.pallets,Math.max(1,Math.ceil(S.accepted/S.bpp)));
  const zs=['A','B','C'], gi=zs.indexOf(sk.grp), order=zs.slice().sort((a,b)=>Math.abs(zs.indexOf(a)-gi)-Math.abs(zs.indexOf(b)-gi)||zs.indexOf(a)-zs.indexOf(b));
  const elig=c=>!c.occ&&((!sk.heavy&&!sk.fragile)||c.l===1);
  let list=[]; order.forEach(z=>{list=list.concat(cells.filter(c=>c.zone===z&&elig(c)).sort((a,b)=>a.pick-b.pick||a.l-b.l));});
  S.store=list.slice(0,S.T); S.spill=S.store.some(c=>c.zone!==sk.grp);
  const all=cells.filter(elig); S.avgRand=all.reduce((a,c)=>a+c.pick,0)/Math.max(1,all.length);
  S.avgPick=S.store.reduce((a,c)=>a+c.pick,0)/Math.max(1,S.store.length);
  S.avgPut=S.store.reduce((a,c)=>a+c.put,0)/Math.max(1,S.store.length);
}

function go(n){S.step=n;S.sub='a';onEnter(n);renderAll();}
function onEnter(n){
  switch(n){
    case 0: clearLot(); setView(0); break;
    case 1: setView(1); showBeam(true); pulseTower(); break;
    case 2: setView(2); truckArrive(); break;
    case 3: setView(3); showBeam(false); unload(); break;
    case 4: setView(4); truckLeave(); initSample(); setScan(true); break;
    case 5: setView(5); computeResult(); W.pallets.forEach(p=>setPalletColor(p,S.decision.accept?C.greenT:C.red,.7)); setScan(false); break;
    case 6:
      setView(6); planStore(); W.pallets.forEach((p,i)=>setPalletColor(p,i<S.T?C.green:C.red,.7));
      W.pallets.forEach((p,i)=>{if(i>=S.T){tween(.8,k=>{const s=1-k;p.scale.set(s,s,s);},()=>{p.visible=false;});}});
      showStoreHighlights(); S.store.forEach((c,i)=>setHighlightColor(i,C.pink)); pulseTower();
      Object.keys(W.zone).forEach(g=>W.zone[g].material.opacity=(g===skuById(S.sku).grp?.34:.08));
      break;
    case 7: S.sub='p'; S.trip=0; S.printed=false; S.labelDone=false; S.arrived=false; S.slotDone=false; setView(1); follow=null; break;
    case 8:
      setView(S.returned?2:8); W.hi.forEach(g=>g.visible=false);
      S.stockAfter=S.stockBefore+(S.returned?0:S.accepted); countUp(); break;
  }
}
let shown=0;
function countUp(){
  const a=S.stockBefore,b=S.stockAfter; tween(1.4,k=>{shown=Math.round(lerp(a,b,easeOut(k)));updateHUD();},()=>{shown=b;updateHUD();});
}
function doReturn(){
  const t=W.truck; if(!t){return;} t.visible=true;
  const dockX=DOCK_X[S.dockIdx]; t.position.set(dockX,0,DOCK_Z+.4+30); W.pallets.forEach(p=>{setPalletColor(p,C.red,.7);p.visible=true;p.scale.set(1,1,1);});
  setView(2);
  tween(1.6,k=>{t.position.z=lerp(DOCK_Z+.4+30,DOCK_Z+.4,easeOut(k));},()=>{
    W.pallets.forEach((p,i)=>{const a=p.position.clone(),b=new THREE.Vector3(dockX,1.05,DOCK_Z+.4+1.2+i*.95);
      tween(.9,k2=>{p.position.lerpVectors(a,b,ease(k2));},()=>{ if(i===W.pallets.length-1){W.pallets.forEach(q=>t.attach(q)); truckLeave();} },i*.12);});
  });
  toast('คืนสินค้าให้โรงงานทั้งล็อต');
}

function primaryInfo(){
  switch(S.step){
    case 0: return {label:'เริ่มรับล็อตนี้',en:setupValid()};
    case 1: return {label:'ตกลง',en:S.listSel};
    case 2: return {label:'ตกลง',en:S.dockScanned};
    case 3: return {label:'ตกลง',en:S.scanned>=S.pallets&&S.counted>=1};
    case 4: return {label:'ดูผลตัดสิน',en:S.sample.checked};
    case 5:
      if(S.decision&&S.decision.accept) return {label:'รับเข้าระบบ',en:true};
      if(!S.action) return {label:'เลือกวิธีจัดการก่อน',en:false};
      if(S.action==='return') return {label:'ยืนยันคืนโรงงาน',en:true};
      return {label:'ไปจัดเก็บ',en:S.good>0};
    case 6: return {label:'ไปออกป้ายและจัดเก็บ',en:true};
    case 7:
      if(S.sub==='p') return {label:'แปะป้ายครบแล้ว ไปขน',en:S.printed};
      if(S.sub==='a') return {label:'ยิงป้ายเพื่อเริ่มขับ',en:false};
      return {label:S.trip>=S.T-1?'เสร็จสิ้น':'พาเลทถัดไป',en:S.slotDone};
    case 8: return {label:'เริ่มล็อตใหม่',en:true};
  }
  return {label:'ตกลง',en:false};
}
function next(){
  if(!primaryInfo().en) return; beep('ok');
  switch(S.step){
    case 0: initLot(); go(1); break;
    case 1: go(2); break;
    case 2: go(3); break;
    case 3: go(4); break;
    case 4: go(5); break;
    case 5: finalizeResult(); if(S.returned){doReturn();go(8);}else go(6); break;
    case 6: go(7); break;
    case 7:
      if(S.sub==='p'){S.sub='a';S.trip=0;S.arrived=false;S.slotDone=false;setView(3);renderAll();}
      else if(S.sub==='b'){
        finishPlace();
        if(S.trip>=S.T-1){S.store.forEach(c=>{c.occ=true;}); go(8);}
        else{S.trip++;S.sub='a';S.arrived=false;S.slotDone=false;setView(3);renderAll();}
      }

    case 8: restart(); break;
  }
}
function doScan(){
  if(S.step===2&&S.truckArrived&&!S.dockScanned){S.dockScanned=true;S.scans++;beep('ok');}
  else if(S.step===3&&S.unloaded&&S.scanned<S.pallets){flashPallet(S.scanned);S.scanned++;S.scans++;recount();beep('ok');}
  else if(S.step===7&&S.sub==='p'&&!S.printed){toast('กดออกป้ายทั้งล็อตก่อน');}
  else if(S.step===7&&S.sub==='a'){S.scans++;beep('ok');S.sub='b';startDrive();}
  else if(S.step===7&&S.sub==='b'&&S.arrived&&!S.slotDone){
    if(S.wrongMsg){S.wrongMsg='';} S.slotDone=true;S.scans++;beep('ok');
  }
  renderAll();
}
function restart(full){

  clearLot(); go(0);
}
function setAuto(on){

function autoTick(){

function autoAct(){
  const pi=primaryInfo();
  switch(S.step){
    case 0: next(); return true;
    case 1: if(!S.listSel){S.listSel=true;renderAll();return true;} next(); return true;
    case 2: if(!S.truckArrived) return false; if(!S.dockScanned){doScan();return true;} next(); return true;
    case 3: if(!S.unloaded) return false; if(S.scanned<S.pallets){doScan();return true;} next(); return true;
    case 4: if(!S.sample.checked){S.sample.checked=true;renderAll();return true;} next(); return true;
    case 5: if(!S.decision.accept&&!S.action){chooseAction('sort');return true;} if(S.action==='sort'&&S.good<=0){chooseAction('return');return true;} next(); return true;
    case 6: next(); return true;
    case 7:
      if(S.sub==='p'){if(!S.printed){printBatch();return true;} next(); return true;}
      if(S.sub==='a'){doScan();return true;}
      if(!S.arrived) return false; if(!S.slotDone){doScan();return true;} next(); return true;
    case 8: return false;
  }

  const hp=$('#hhProg'); if(!hp.children.length){for(let i=0;i<STEPS.length;i++)hp.appendChild(document.createElement('i'));} [...hp.children].forEach((e,i)=>{e.className=i<S.step?'d':(i===S.step?'c':'');});
  $('#hhTitle').textContent=sc.title; $('#hhSub').textContent=sc.sub; body.innerHTML=sc.body; $('#hhFoot').innerHTML=sc.foot;
  const key=S.step+'.'+(S.step===7?S.trip+S.sub:'')+(S.step===5?(S.action||''):'');
  if(key!==lastKey){body.classList.remove('in');void body.offsetWidth;body.classList.add('in');body.scrollTop=0;lastKey=key;}
  else body.scrollTop=keep;
}

function renderTop(){
  const segs=$('#segs'); if(!segs.children.length){for(let i=0;i<STEPS.length;i++)segs.appendChild(document.createElement('i'));}
  [...segs.children].forEach((e,i)=>{e.className=i<S.step?'done':(i===S.step?'cur':'');});
  $('#stepName').textContent='ขั้นที่ '+(S.step+1)+'/'+STEPS.length+' · '+STEPS[S.step];
  $('#chipScan').textContent='สแกน '+S.scans+' ครั้ง';
  const v=VENDORS[S.vendor], cv=$('#chipVendor'); cv.textContent=v.name+' · ตรวจ'+LEVEL_NAME[v.state]; cv.className='chip '+(v.state==='tightened'?'bad':v.state==='reduced'?'ok':'');
}

const CODE_LET=['E','F','G','H','J','K'], LET_N={E:13,F:20,G:32,H:50,J:80,K:125};
const pc=x=>(x*100).toFixed(1)+'%';
function acHTML(){
  const N=Math.max(1,S.counted||S.po), p=planFor(N), L=CODE_LET[Math.min(p.idx,5)];

  let risk=''; [.005,.01,.02,.03,.05,.1].forEach(q=>{risk+='<tr><td>'+(q*100).toFixed(1)+'%</td><td>'+pc(binomPa(p.nMaj,p.acMaj,q))+'</td><td>'+pc(binomPa(p.nMin,p.acMin,q))+'</td></tr>';});
  const n=p.nMaj, paM=binomPa(n,p.acMaj,.02), ati=n+(1-paM)*(N-n), aoq=paM*.02*(N-n)/N;

    '<li>นับขนาดล็อต N = <b>'+fmt(N)+'</b> กล่อง (นับได้จากการสแกน)</li>'+
    '<li>หาอักษรรหัสตามขนาดล็อต (ระดับทั่วไป II): N อยู่ช่วง '+PLAN_LABEL[p.idx]+' → อักษร <b>'+L+'</b></li>'+
    '<li>อ่านขนาดตัวอย่าง: อักษร '+L+' ให้ n = '+LET_N[L]+' แต่ตารางมีลูกศรให้ใช้แผนข้างเคียง ได้ n สำคัญ = <b>'+p.nMaj+'</b> และ n เล็กน้อย = <b>'+p.nMin+'</b>'+(p.full?' (ล็อตเล็กกว่าแผน จึงตรวจทุกกล่อง)':'')+'</li>'+

    '<div class="f">Re = Ac + 1<br>รับ ⇔ d ≤ Ac &nbsp;·&nbsp; ไม่รับ ⇔ d ≥ Re<small>d = จำนวนกล่องเสียที่พบในตัวอย่าง ร้ายแรง: Ac = 0 (เจอ 1 กล่องไม่รับ)</small></div>'+
    '<table><tr><th>กล่องในล็อต</th><th>อักษร</th><th>สำคัญ n · Ac/Re</th><th>เล็กน้อย n · Ac/Re</th></tr>'+rows+'</table>'+
    '<div class="f">Pa = Σ C(n,d) · p<sup>d</sup> · (1−p)<sup>n−d</sup>, d = 0…Ac<small>Pa = โอกาสรับล็อต เมื่อสัดส่วนเสียจริงในล็อต = p</small></div>'+

}

function drawOC(){
  const cv=$('#oc'); if(!cv||!cv.getContext) return; const x=cv.getContext('2d'); if(!x) return;
  const p=S.plan||planFor(Math.max(1,S.counted||S.po)), w=cv.width,h=cv.height, L=46,R=12,T=14,B=34;
  x.clearRect(0,0,w,h); x.font='600 20px Pretendard,Kanit,sans-serif'; x.fillStyle='#dce0e1'; x.strokeStyle='rgba(220,224,225,.18)'; x.lineWidth=1;
  for(let i=0;i<=4;i++){const yy=T+(h-T-B)*i/4; x.beginPath();x.moveTo(L,yy);x.lineTo(w-R,yy);x.stroke(); x.fillText((100-i*25)+'%',2,yy+6);}
  const maxP=.12, X=pp=>L+(w-L-R)*pp/maxP, Y=a=>T+(h-T-B)*(1-a);
  [0,.04,.08,.12].forEach(pp=>{x.fillText((pp*100).toFixed(0)+'%',X(pp)-12,h-8);});
  const curve=(n,c,col)=>{x.strokeStyle=col;x.lineWidth=3;x.beginPath();for(let i=0;i<=60;i++){const pp=maxP*i/60,a=binomPa(n,c,pp);i?x.lineTo(X(pp),Y(a)):x.moveTo(X(pp),Y(a));}x.stroke();};
  curve(p.nMaj,p.acMaj,'#ff4a43'); curve(p.nMin,p.acMin,'#7aa0f0');
  const d=S.sample;
  const dot=(n,c,dd,col)=>{const ph=n>0?clamp(dd/n,0,maxP):0,a=binomPa(n,c,ph); x.fillStyle=col;x.beginPath();x.arc(X(ph),Y(a),7,0,Math.PI*2);x.fill();};
  dot(p.nMaj,p.acMaj,d.major,'#ff4a43'); dot(p.nMin,p.acMin,d.minor,'#7aa0f0');
}
function renderDrawer(){
  const dr=$('#drawer'); const key=S.step+':'+S.trip+':'+S.dtab;
  if(dr.dataset.k!==key){ if(!S.drawerOpen) $('#drawerDot').style.display='inline-block'; dr.dataset.k=key; }
  const body=S.dtab==='ac'?acHTML():S.dtab==='abc'?abcHTML():drawerHTML();
  const tabs='<div class="dtabs">'+[['step','ขั้นนี้'],['ac','สุ่มตรวจ Ac/Re'],['abc','ABC']].map(t=>'<button class="'+(S.dtab===t[0]?'on':'')+'" data-act="dtab" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  const keepTop=dr.scrollTop; dr.innerHTML=tabs+body; if($('#oc')) drawOC(); dr.scrollTop=keepTop;
}
function dashStats(){
  const used=cells.filter(c=>c.occ).length, total=cells.length;
  const zones=['A','B','C'].map(z=>({z:z,pct:zoneOcc(z)}));
  const lv=[1,2,3].map(l=>{const a=cells.filter(c=>c.l===l);return Math.round(a.filter(c=>c.occ).length/a.length*100);});
  const cover=SKUS.filter(x=>x.picks!=null).map(x=>({name:x.name,days:Math.round(x.onhand/(x.picks/30))})).sort((a,b)=>b.days-a.days);
  let pass=0,tot=0; Object.keys(VENDORS).forEach(k=>{const h=VENDORS[k].hist.slice(-10); pass+=h.filter(q=>q==='P').length; tot+=h.length;});
  return {pct:Math.round(used/total*100),used:used,total:total,zones:zones,lv:lv,cover:cover,over:cover.filter(c=>c.days>90).length,passPct:tot?Math.round(pass/tot*100):0};
}
function renderDash(){
  const el=$('#dash'); if(!S.dashOpen){el.hidden=true;return;} el.hidden=false;
  const d=dashStats(), ACC=96.8;
  const kpi=(title,val,ok,sub,live)=>'<div class="dc k '+(ok?'ok':'bad')+'"><h3>'+title+' <span class="tg '+(live?'live':'')+'">'+(live?'สด':'ตัวอย่าง')+'</span></h3><div class="big">'+val+'</div><span class="st">'+(ok?'ปกติ':'ต้องดูแล')+'</span><div class="sub">'+sub+'</div></div>';
  const bar=(label,pct,bad)=>'<div class="br"><span>'+label+'</span><div class="bar"><i class="'+(bad?'r':'')+'" style="width:'+Math.min(100,pct)+'%"></i></div><span>'+pct+'%</span></div>';
  const utilOk=d.pct>=40&&d.pct<=85;
  const cov=d.cover.slice(0,6).map(c=>'<div class="br"><span style="width:150px">'+c.name+'</span><div class="bar"><i class="'+(c.days>90?'r':'')+'" style="width:'+Math.min(100,c.days/3)+'%"></i></div><span style="width:56px">'+c.days+' วัน</span></div>').join('');
  const ven=Object.keys(VENDORS).map(k=>{const v=VENDORS[k]; const dots=v.hist.slice(-10).map(x=>'<i class="'+(x==='F'?'f':'')+'"></i>').join('');
    return '<div class="vr"><b>'+v.name+'</b><span class="tg '+(v.state==='tightened'?'':'')+'">ตรวจ'+LEVEL_NAME[v.state]+'</span><span>ผ่านติดกัน '+consecPass(v)+'</span><div class="dots" title="10 ล็อตล่าสุด">'+dots+'</div></div>';}).join('');
  const log=S.log.length?'<table><tr><th>เวลา</th><th>โรงงาน</th><th>สินค้า</th><th>กล่อง</th><th>ผล</th></tr>'+S.log.map(r=>'<tr><td>'+r.t+'</td><td>'+r.v+'</td><td>'+r.sku+'</td><td>'+fmt(r.qty)+'</td><td class="res '+(r.res==='ผ่าน'?'p':'n')+'">'+r.res+'</td></tr>').join('')+'</table>':'<div class="sub">ยังไม่มีล็อต เล่นเดโมแล้วตารางนี้จะอัปเดตเอง</div>';
  const sap=['ยอดสต็อกตามช่องเก็บ','เอกสารรับสินค้า (GR)','ใบสั่งซื้อ (PO)','ประวัติการหยิบออก','ข้อมูลหลักสินค้า (ขนาด น้ำหนัก ความเปราะ)','ผลสุ่มตรวจและโรงงาน (ส่วนที่เพิ่มใหม่)'].map(x=>'<span>'+x+'</span>').join('');
  el.innerHTML='<div class="dh"><div><h2>สุขภาพคลัง</h2><p>มุมมองผู้บริหาร · ป้าย "สด" คำนวณจากเดโมนี้ ป้าย "ตัวอย่าง" เป็นค่าสมมติ</p></div><button class="dx" id="dashX" aria-label="ปิด Dashboard">✕</button></div>'+
    '<div class="grid">'+
    kpi('การใช้พื้นที่เก็บ',d.pct+'%',utilOk,'ใช้ '+fmt(d.used)+' จาก '+fmt(d.total)+' ช่อง · เกณฑ์ 40–85%',true)+
    kpi('ความแม่นยำสต็อก',ACC+'%',false,'สต็อกในระบบตรงกับของจริง · เป้า ≥ 99%',false)+
    kpi('ล็อตผ่านสุ่มตรวจ',d.passPct+'%',d.passPct>=90,'10 ล็อตล่าสุดของทุกโรงงาน · เกณฑ์ ≥ 90%',true)+
    kpi('สินค้าสต็อกค้าง > 90 วัน',d.over+' รายการ',d.over===0,'จาก '+d.cover.length+' รายการ · เป้า 0',false)+
    '<div class="dc s2"><h3>การใช้พื้นที่ตามโซน <span class="tg live">สด</span></h3>'+d.zones.map(z=>bar('โซน '+z.z,z.pct,z.pct>85)).join('')+'<div class="sub">ตามชั้น: L1 '+d.lv[0]+'% · L2 '+d.lv[1]+'% · L3 '+d.lv[2]+'% (ของหนักใช้ชั้น L1 ช่อง L1 จึงเต็มก่อน)</div></div>'+
    '<div class="dc s2"><h3>สต็อกพอขายกี่วัน (เรียงมากสุด) <span class="tg">ตัวอย่าง</span></h3>'+cov+'<div class="sub">วัน = สต็อก ÷ (หยิบต่อเดือน ÷ 30) · แดง = เกิน 90 วัน ควรชะลอการสั่ง</div></div>'+
    '<div class="dc s2"><h3>โรงงาน (ผลสุ่มตรวจ) <span class="tg live">สด</span></h3>'+ven+'<div class="sub">จุดเขียว = ล็อตผ่าน จุดแดง = ไม่ผ่าน (เก่า → ใหม่)</div></div>'+
    '<div class="dc s2"><h3>ล็อตที่รับในเดโมนี้ <span class="tg live">สด</span></h3>'+log+'</div>'+
    '<div class="dc s4"><h3>ข้อมูลที่ต้องดึงจาก SAP</h3><div class="chips">'+sap+'</div><div class="sub" style="margin-top:8px">ต้องยืนยันกับทีม IT ว่าแต่ละรายการดึงได้จริงและมาจากตารางหรือโมดูลไหนของ SAP ที่บุญถาวรใช้</div></div>'+
    '</div>';
}
function renderAll(){renderTop();renderPhone();renderDrawer();refreshPinText();updateHUD();if(SEL.key)renderInfo();if(S.dashOpen)renderDash();}

/* =====================================================================
   เหตุการณ์
   ===================================================================== */
const ACTIONS={
  next:()=>next(), scan:()=>doScan(),
  vendor:d=>{S.vendor=d.v;S.dockIdx=VENDORS[S.vendor].dock-1;renderAll();},
  preset:d=>{S.preset=d.v;renderAll();},
  po:d=>{S.po=clamp((S.po||0)+Number(d.d),5,3000);S.pallets=Math.min(S.pallets,S.po,10);renderAll();},
  pickList:()=>{S.listSel=true;beep('ok');renderAll();},
  checked:()=>{S.sample.checked=!S.sample.checked;renderAll();},
  photo:()=>toast('ถ่ายรูปแล้ว แนบกับผลตรวจของล็อตนี้'),
  'act-sort':()=>chooseAction('sort'), 'act-return':()=>chooseAction('return'), 'act-clear':()=>{S.action=null;renderAll();},
  wrong:()=>{ if(!S.arrived||S.slotDone) return; const o=cells.find(x=>x.zone===S.store[S.trip].zone&&x.i!==S.store[S.trip].i&&x.l===S.store[S.trip].l)||cells[0]; S.wrongMsg='ยิงได้ '+o.code+' แต่ต้องเป็น '+S.store[S.trip].code; beep(false); renderAll();},
  print:()=>printBatch(),
  dtab:d=>{S.dtab=d.v;renderDrawer();},
  skip:()=>{S.fastTrips=true; toast('ข้ามพาเลทที่เหลือ: เก็บเข้าช่องตามระบบ'); (function runner(){ if(S.step!==7) return;
    if(S.sub==='p'){ if(!S.printed) printBatch(); next(); setTimeout(runner,200); }
    else if(S.sub==='a'){ doScan(); setTimeout(runner,200); }
    else { if(!S.arrived){setTimeout(runner,250);return;} if(!S.slotDone){S.slotDone=true;S.scans++;renderAll();} next(); setTimeout(runner,200); } })(); },
  resetAll:()=>{restart(true);},
  inc:d=>bump(d.k,1), dec:d=>bump(d.k,-1)
};
function bump(k,dir){
  if(k==='pallets'){S.pallets=clamp(S.pallets+dir,1,Math.min(10,S.po)); }
  else if(k==='adj'){const s=S.palletBoxes.slice(0,S.scanned).reduce((a,b)=>a+b,0); if(S.counted+dir>=1) S.adj+=dir;}
  else if(k==='crit'||k==='major'||k==='minor'){S.sample[k]=clamp(S.sample[k]+dir,0,S.plan.n);}
  else if(k==='good'){S.good=clamp(S.good+dir,0,S.counted);}
  if(k==='adj') recount(); renderAll();
}
document.addEventListener('click',e=>{
  if(e.target.closest('#infoX')){closeInfo();return;}
  if(e.target.closest('#dashX')){S.dashOpen=false;$('#bDash').classList.remove('on');renderDash();return;}
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  if(S.auto&&el.closest('#phone')) setAuto(false);
  const a=el.dataset.act; if(ACTIONS[a]) ACTIONS[a](el.dataset);
});
document.addEventListener('input',e=>{
  if(e.target.id==='inPo'){
    S.po=Math.round(Number(e.target.value)||0); S.pallets=clamp(S.pallets,1,Math.max(1,Math.min(10,S.po)));
    const w=$('#setupWarn'); if(w) w.textContent=setupValid()?'':'ใส่ PO 5–3,000 กล่อง และพาเลทไม่เกินจำนวนกล่อง';
    const b=$('#bppNote'); if(b&&S.po>0) b.textContent='≈ '+Math.ceil(S.po/S.pallets)+' กล่อง/พาเลท';
    const f=$('#hhFoot button'); if(f) f.disabled=!setupValid();
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='selSku'){S.sku=e.target.value; renderAll();}
  if(e.target.id==='inPo'){S.po=clamp(Math.round(Number(e.target.value)||5),5,3000); S.pallets=Math.min(S.pallets,S.po,10); renderAll();}
});
['trigL','trigR'].forEach(id=>$('#'+id).addEventListener('click',()=>{if(S.auto)setAuto(false);doScan();}));

(function(){const hud=$('#hud'),cap=$('#hudCap'),pct=$('#hudPct');

  new MutationObserver(sync).observe(pct,{childList:true,characterData:true,subtree:true});sync();

$('#bHH').addEventListener('click',()=>{S.phoneOn=!S.phoneOn; $('#bHH').setAttribute('aria-pressed',S.phoneOn?'true':'false'); resize();});
$('#bSnd').addEventListener('click',()=>{S.sound=!S.sound;$('#bSnd').setAttribute('aria-pressed',S.sound?'true':'false');});
$('#bReset').addEventListener('click',()=>{setAuto(false);restart(false);});
$('#drawerBtn').addEventListener('click',()=>{
  S.drawerOpen=!S.drawerOpen; $('#drawer').classList.toggle('open',S.drawerOpen); $('#drawerBtn').setAttribute('aria-expanded',S.drawerOpen?'true':'false'); $('#drawerDot').style.display='none';
});

(function init(){

  if(window.__DTS_EXPOSE) window.__dts={S:S,go:go,next:next,doScan:doScan,frame:frame,tick:function(ms){last-=ms;frame(last+ms);},primaryInfo:primaryInfo,ACTIONS:ACTIONS,planFor:planFor,decide:decide,cells:cells,VENDORS:VENDORS,SKUS:SKUS,autoAct:autoAct,TW:TW,renderDash:renderDash,dashStats:dashStats,acHTML:acHTML,abcHTML:abcHTML,pickNDC:pickNDC,SEL:SEL,infoFor:infoFor,closeInfo:closeInfo,renderInfo:renderInfo,pickAt:pickAt,VIEWS_TOP:VIEWS_TOP,LAYOUT:LAYOUT,refreshView:refreshView,resize:resize,scene:scene,camera:camera,view:view,goal:goal,user:user,VIEWS:VIEWS,W:W,updateCamera:updateCamera,PINDEFS:PINDEFS,chooseAction:chooseAction,restart:restart,screen:screen,drawerHTML:drawerHTML,binomPa:binomPa};
})();

})();
